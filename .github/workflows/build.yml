name: build

# PPF CI (design §26.3).
# - `quality`: lint / vue-tsc / tests / Nuxt SSG build (frontend only).
# - `wasm`   : builds the vendored Rust viewer (monitor-common + monitor-client)
#              with wasm-pack (--target web) into `src/public/viewer/` and
#              uploads the artifact. Runs independently so frontend CI does not
#              block on the Rust toolchain. The artifact is consumed by release
#              packaging (or by SSG when the viewer dir is pre-populated).
# Tauri Windows/Android native pipelines are later (per design §17).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Official builds choose the official endpoints explicitly. Self-host builds
# must provide their own values; nuxt.config.ts fails fast when either is absent.
env:
  NUXT_PUBLIC_API_BASE: https://api-phira.htadiy.com
  NUXT_PUBLIC_AUTH_BASE: https://api-phira.htadiy.com
  NUXT_PUBLIC_SITE_URL: https://phira.htadiy.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: WASM Viewer (wasm-pack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Builds the vendored viewer to src/public/viewer (web target, ESM).
      # Uses an absolute --out-dir to avoid wasm-pack CWD ambiguity.
      # NOTE: wasm-pack names the JS module with underscores (crate name),
      # so the ESM entry is `monitor_client.js` + `monitor_client_bg.wasm`.
      - name: Build viewer
        run: wasm-pack build --target web --out-dir "$GITHUB_WORKSPACE/src/public/viewer" viewer/monitor-client

      - name: Verify artifacts
        run: |
          test -f src/public/viewer/monitor_client_bg.wasm
          test -f src/public/viewer/monitor_client.js

      - name: Upload generated Cargo.lock (reproducibility)
        uses: actions/upload-artifact@v4
        with:
          name: viewer-cargo-lock
          path: viewer/Cargo.lock
          if-no-files-found: warn

      - name: Upload viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-wasm
          path: src/public/viewer
          if-no-files-found: error

  quality:
    name: Lint / typecheck / test / SSG build
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Download WASM viewer
        uses: actions/download-artifact@v4
        with:
          name: viewer-wasm
          path: src/public/viewer

      - name: ESLint
        run: pnpm lint

      - name: vue-tsc
        run: pnpm vue-tsc

      - name: Current documentation truthfulness
        run: python3 scripts/check-current-docs.py

      - name: Unit / component tests
        run: pnpm test

      # Contract-consistency gate (design CONTRACT_CONSISTENCY_TEST.md, Gate 0):
      # every /api/v1 and /ws/v1 call in src/ must be registered in PPB's
      # OpenAPI (fetched from the PPB repo). CI fails on any unregistered call.
      - name: Contract consistency (calls vs PPB OpenAPI)
        run: node scripts/check-contract-consistency.mjs
      - name: Frontend Design Contract gate
        run: pnpm test:design-contract

      - name: Error locale completeness gate
        run: pnpm test:error-i18n
      - name: Product copy / accessibility i18n gate
        run: pnpm test:product-copy


      - name: Nuxt SSG build
        run: pnpm build

      - name: Link / static sanity
        run: |
          test -f .output/public/index.html
          test -f .output/public/robots.txt
          test -f .output/public/sitemap_index.xml
          test -f .output/public/viewer/monitor_client.js
          test -f .output/public/viewer/monitor_client_bg.wasm
          grep -q "Skip to content" .output/public/index.html
          grep -q "Phira+" .output/public/index.html

  official-image-smoke:
    name: Official image / direct routes
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build official PPF image from no cache
        run: docker compose -f compose.ci.yml build --no-cache ppf
      - name: Start official image
        run: docker compose -f compose.ci.yml up -d ppf
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install test harness
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser direct-route / refresh smoke
        env:
          PPF_E2E_BASE: http://127.0.0.1:18080
        run: node scripts/e2e-direct-routes.mjs
      - name: Docker diagnostics
        if: failure()
        run: docker compose -f compose.ci.yml logs --no-color ppf
      - name: Stop CI compose
        if: always()
        run: docker compose -f compose.ci.yml down -v

  # Gate 7 — Tauri 2 native shell (design §17 / §26.3).
  # Windows (nsis+msi) and Android (apk). The frontend is the Nuxt SSG output
  # (.output/public) + the CI-built WASM viewer. Signing (updater) uses CI
  # secrets when present and is skipped otherwise; FCM (google-services.json)
  # is skipped until the Owner supplies it. No lockstep release — versions are
  # per-repo (tauri.conf.json + package.json).
  tauri-windows:
    name: Tauri Windows (nsis/msi)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [quality, wasm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM viewer
        uses: actions/download-artifact@v4
        with:
          name: viewer-wasm
          path: src/public/viewer

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install + build frontend (Nuxt SSG)
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate app icons (from source png)
        run: pnpm dlx @tauri-apps/cli@2 icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Build Tauri (nsis + msi)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: pnpm dlx @tauri-apps/cli@2 build --bundles nsis,msi

      # Installer code-signing — gates inside the script (GitHub forbids the
      # `secrets` context in `if:`). Runs every build; skips when WINDOWS_CERT
      # (base64 .pfx) + WINDOWS_CERT_PASSWORD are not configured.
      - name: Sign Windows artifacts (if cert provided)
        shell: pwsh
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT) {
            Write-Host "WINDOWS_CERT not set — skipping installer signing."
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          $pfx = 'src-tauri/target/release/bundle/phiraplus.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe not found (Windows SDK)' }
          Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -Include *.exe,*.msi | ForEach-Object {
            Write-Host "Signing $($_.FullName)"
            & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
          }
          Remove-Item $pfx -ErrorAction SilentlyContinue

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.exe" -o -name "*.msi" \) -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/SHA256SUMS.txt

  tauri-android:
    name: Tauri Android (apk)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality, wasm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM viewer
        uses: actions/download-artifact@v4
        with:
          name: viewer-wasm
          path: src/public/viewer

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install + build frontend (Nuxt SSG)
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,armv7-linux-androideabi,
            i686-linux-android,x86_64-linux-android

      - name: Note FCM availability
        run: |
          if [ -f google-services.json ]; then
            echo "google-services.json present — FCM will be integrated."
          else
            echo "google-services.json MISSING — FCM integration skipped (pending Owner credentials)."
          fi

      - name: Generate app icons (from source png)
        run: pnpm dlx @tauri-apps/cli@2 icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Init Tauri Android project
        run: pnpm dlx @tauri-apps/cli@2 android init

      # Android release signing — gates inside the script (GitHub forbids the
      # `secrets` context in `if:`). Runs every build; skips when the keystore
      # secrets are absent (unsigned APK). When present, decodes the .jks into
      # the app module and wires gradle's release signingConfig (reads ANDROID_*
      # env at build time).
      - name: Configure Android release signing (if keystore provided)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "ANDROID_KEYSTORE not set — skipping release signing (unsigned APK)."
            exit 0
          fi
          mkdir -p src-tauri/gen/android/app
          echo "$ANDROID_KEYSTORE" | base64 -d > src-tauri/gen/android/app/release.keystore
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('src-tauri/gen/android/app/build.gradle.kts')
          txt = p.read_text(encoding='utf-8')
          if 'signingConfigs' not in txt:
              txt = re.sub(
                  r'android\s*\{',
                  'android {\n    signingConfigs {\n        create("release") {\n'
                  '            storeFile = file("release.keystore")\n'
                  '            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""\n'
                  '            keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: ""\n'
                  '            keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: ""\n'
                  '        }\n    }',
                  txt, count=1,
              )
              txt = re.sub(
                  r'buildTypes\s*\{\s*release\s*\{',
                  'buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("release")',
                  txt, count=1,
              )
              p.write_text(txt, encoding='utf-8')
              print('Patched build.gradle.kts with release signingConfig')
          else:
              print('build.gradle.kts already has signingConfigs')
          PY

      - name: Build Tauri Android (apk)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm dlx @tauri-apps/cli@2 android build --apk

      # Tauri's `android build --apk` emits a *universal* (fat, all-ABI) APK
      # that is unsigned by design (`app-universal-release-unsigned.apk`): the
      # release signingConfig only signs per-ABI APKs, and the universal merge
      # strips signatures. Sign it here with apksigner so the published artifact
      # is installable. Skips (leaves the APK unsigned) when the keystore
      # secrets are absent.
      - name: Sign universal APK (apksigner)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "ANDROID_KEYSTORE not set — leaving APK unsigned (dev artifact)."
            exit 0
          fi
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          UNSIGNED="$(find "$APK_DIR" -maxdepth 1 -name '*-unsigned.apk' | head -n1)"
          if [ -z "$UNSIGNED" ]; then
            echo "No unsigned universal APK found — nothing to sign."
            exit 0
          fi
          SIGNED="${UNSIGNED%-unsigned.apk}.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ] || [ ! -x "$BT/zipalign" ]; then
            echo "ERROR: apksigner/zipalign not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          KEYSTORE="src-tauri/gen/android/app/release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            mkdir -p "$(dirname "$KEYSTORE")"
            echo "$ANDROID_KEYSTORE" | base64 -d > "$KEYSTORE"
          fi
          echo "zipalign + apksigner: $UNSIGNED -> $SIGNED (build-tools: $BT)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$SIGNED"
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            "$SIGNED"
          "$BT/apksigner" verify "$SIGNED"
          rm -f "$UNSIGNED"
          echo "Signed OK: $SIGNED"

      - name: Compute SHA256SUMS
        run: |
          cd src-tauri/gen/android
          find . -name "*.apk" -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android
          path: |
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/SHA256SUMS.txt
