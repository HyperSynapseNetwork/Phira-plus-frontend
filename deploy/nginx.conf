server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Nuxt SSG owns static assets; dynamic entity routes hydrate client-side.
    # Direct address-bar navigation/refresh must therefore fall back to the SPA.
    try_files $uri $uri/ $uri.html /index.html;
  }

  location /_nuxt/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /viewer/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
